<!DOCTYPE html>
<html lang="ko"> 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>산:우리 - 점검 중</title>
<script>
(function() {
  var userAgent = navigator.userAgent.toLowerCase();
  var targetUrl = location.href;

  if (userAgent.indexOf('kakaotalk') > -1) {
    if (userAgent.indexOf('android') > -1) {
      var parsedUrl = targetUrl.replace(/^https?:\/\//, '');
      location.href = 'intent://' + parsedUrl + '#Intent;scheme=https;package=com.android.chrome;end';
    } else if (userAgent.indexOf('iphone') > -1 || userAgent.indexOf('ipad') > -1 || userAgent.indexOf('ipod') > -1) {
      location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(targetUrl);
    }
  }
})();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

.main-container { max-width: 480px; margin: 0 auto; min-height: 100vh; background: white; box-shadow: 0 0 20px rgba(0,0,0,0.05); }

</head>

    </main>
